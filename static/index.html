<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Microgrid Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#6b7280;--bd:#e3e7ee;--grid:#2563eb;--ren:#16a34a;--red:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--tx:#e8edf7;--mut:#9aa7bf;--bd:#27345a}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:20px;margin:0}
main{padding:0 24px 32px;display:grid;gap:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.k{color:var(--mut);font-size:12px;text-transform:uppercase}.v{font-size:26px;font-weight:700;margin-top:4px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;color:#fff;font-weight:600}
.Main{background:var(--grid)}.Ren{background:var(--ren)}
#alert{display:none;background:var(--red);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600}
#err{display:none;color:var(--red)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select,button{padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
button{background:var(--grid);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:var(--ren)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
tr.o td{background:rgba(220,38,38,.12)}
</style></head><body>
<header><h1>⚡ Smart Energy Microgrid · 24h Demand Forecast</h1><span class="k" id="src">source: –</span></header>
<main>
<div id="alert"></div><div id="err"></div>
<div class="card"><div class="ctl">
 <label>Sample day<select id="day"></select></label>
 <label>Heat-wave stress (+°C)<input id="heat" type="number" value="0" step="1" style="width:90px"></label>
 <label>Starting SoC %<input id="soc" type="number" value="80" min="0" max="100" style="width:90px"></label>
 <button onclick="loadSample()">Run sample forecast</button>
 <label>Upload telemetry CSV<input id="file" type="file" accept=".csv"></label><button class="s" onclick="upload()">Upload &amp; forecast</button>
</div>
<details style="margin-top:12px"><summary>Manual entry (one hour)</summary><div class="ctl" style="margin-top:8px">
 <label>Timestamp<input id="m_ts" value="2024-06-01 19:00:00"></label><label>Temp °C<input id="m_t" type="number" value="31"></label>
 <label>Humidity %<input id="m_h" type="number" value="55"></label><label>Solar W/m²<input id="m_s" type="number" value="0"></label>
 <button onclick="manual()">Forecast hour</button></div></details></div>
<div class="grid">
 <div class="card"><div class="k">Current mode (hour 1)</div><div class="v"><span id="mode" class="badge Main">–</span></div></div>
 <div class="card"><div class="k">Peak demand</div><div class="v" id="peak">–</div></div>
 <div class="card"><div class="k">Overload hours</div><div class="v" id="ovl">–</div></div>
 <div class="card"><div class="k">Battery SoC (end)</div><div class="v" id="socEnd">–</div></div>
</div>
<div class="card"><canvas id="ch" height="110"></canvas></div>
<div class="card"><div class="k" style="margin-bottom:6px">Battery state of charge (%)</div><canvas id="soc2" height="60"></canvas></div>
<div class="card wrap"><table><thead><tr><th>Time</th><th>Predicted kW</th><th>Grid mode</th><th>SoC %</th><th>Alerts</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="card wrap"><div class="k">System log</div><table><tbody id="log"></tbody></table></div>
</main>
<script>
let ch,ch2;const $=i=>document.getElementById(i);
const sel=$('day');for(let i=0;i<41;i++)sel.add(new Option('Day '+(i+1),i));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
async function call(p,o){$('err').style.display='none';try{const r=await fetch(p,o);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);render(j);hist()}catch(e){$('err').textContent='Error: '+e.message;$('err').style.display='block'}}
const q=()=>`soc0=${$('soc').value}&heat=${$('heat').value}`;
const loadSample=()=>call(`/api/sample?start=${sel.value}&${q()}`);
const upload=async()=>{const f=$('file').files[0];if(!f)return alert('Choose a CSV');const t=await f.text();call('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:t,soc0:+$('soc').value,heat:+$('heat').value})})};
const manual=()=>call('/api/forecast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({soc0:+$('soc').value,heat:+$('heat').value,rows:[{timestamp:$('m_ts').value,ambient_temp_c:+$('m_t').value,humidity_pct:+$('m_h').value,solar_irradiance_wm2:+$('m_s').value}]})});
function render(j){const f=j.forecast,s=j.summary,lab=f.map(r=>r.timestamp.slice(5,16));
 $('src').textContent='source: '+s.source;$('peak').textContent=s.peak_kw+' kW';$('ovl').textContent=s.overload_hours;$('socEnd').textContent=f[f.length-1].soc_pct+'%';
 const m=$('mode');m.textContent=f[0].mode;m.className='badge '+(f[0].mode=='Main Grid'?'Main':'Ren');
 const a=$('alert'),ov=f.filter(r=>r.critical_overload);
 if(ov.length){a.style.display='block';a.textContent='🚨 CRITICAL OVERLOAD ≥200 kW at: '+ov.map(r=>r.timestamp.slice(11,16)).join(', ')}else if(f.some(r=>r.low_battery)){a.style.display='block';a.style.background='#d97706';a.textContent='⚠ Battery below 10% during forecast window'}else a.style.display='none';
 if(ov.length)a.style.background='';
 const colors=f.map(r=>r.critical_overload?css('--red'):r.mode=='Main Grid'?css('--grid'):css('--ren'));
 ch&&ch.destroy();ch=new Chart($('ch'),{type:'bar',data:{labels:lab,datasets:[{type:'line',label:'160 kW switch',data:f.map(_=>160),borderColor:'#d97706',borderDash:[6,4],pointRadius:0},{type:'line',label:'200 kW overload',data:f.map(_=>200),borderColor:'#dc2626',borderDash:[6,4],pointRadius:0},{label:'Predicted demand (kW) – blue=Main, green=Renewable, red=Overload',data:f.map(r=>r.predicted_kw),backgroundColor:colors}]},options:{scales:{y:{beginAtZero:true,title:{display:true,text:'kW'}}}}});
 ch2&&ch2.destroy();ch2=new Chart($('soc2'),{type:'line',data:{labels:lab,datasets:[{label:'SoC %',data:f.map(r=>r.soc_pct),borderColor:css('--ren'),fill:true,backgroundColor:'rgba(22,163,74,.15)'}]},options:{scales:{y:{min:0,max:100}}}});
 $('tb').innerHTML=f.map(r=>`<tr class="${r.critical_overload?'o':''}"><td>${r.timestamp}</td><td>${r.predicted_kw}</td><td><span class="badge ${r.mode=='Main Grid'?'Main':'Ren'}">${r.mode}</span></td><td>${r.soc_pct}</td><td>${r.critical_overload?'🚨 Critical overload ':''}${r.low_battery?'⚠ Low battery':''}</td></tr>`).join('')}
async function hist(){const h=await (await fetch('/api/history')).json();$('log').innerHTML=h.map(x=>`<tr><td>${x.ts}</td><td>${x.source}</td><td>${x.rows} rows</td><td>peak ${x.peak_kw} kW</td><td>${x.overload_hours} overload h</td></tr>`).join('')}
loadSample();
</script></body></html>
